name: Chinese documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'docs-site/**', 'examples/**', '.github/workflows/docs-check.yml']
  pull_request:
    paths: ['docs/**', 'docs-site/**', 'examples/**', '.github/workflows/docs-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --prefix docs-site
      - run: npm run check --prefix docs-site
