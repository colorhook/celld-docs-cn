<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 690" role="img" aria-labelledby="assetsFlowTitle assetsFlowDesc">
  <title id="assetsFlowTitle">celld 如何在静态资源与 Worker 之间选择</title>
  <desc id="assetsFlowDesc">请求依次检查方法、run_worker_first、_redirects、html_handling、未命中后的指针刷新和 not_found_handling。非 GET 或 HEAD，以及匹配 Worker 优先规则的请求，直接交给 Worker。重定向取首个匹配，200 规则在目标路径重新路由。HTML 查找命中返回 200，非规范路径返回 307。未命中后每五秒最多刷新一次部署指针。导航请求或无 Worker 时，单页应用回退到 index.html，404-page 返回最近的 404.html。最终没有匹配项则由 Worker 响应，无 Worker 时返回 404。绿色表示静态资源层，灰色表示 Worker。资源内容缺失或损坏返回 502，不会回退到 Worker。</desc>
  <style>
    /* GitHub renders this file as an image, so the diagram carries literal
       colours here. The site rules in landing/src/style.css are more specific,
       so the documentation theme tokens win there. SVG paints text black by
       default, and a class that sets only `color` never reaches the fill, so
       every label sets fill="currentColor" as well. */
    svg { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    text { font-size: 12px; fill: currentColor; }
    tspan { fill: currentColor; }
    .sm { font-size: 11px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .d-ink { color: #121212; }
    .d-soft { color: #3d3b37; }
    .d-faint { color: #6e6a62; }
    .d-acc { color: #10803f; }
    .d-panel { color: #ffffff; }
    .d-sunk { color: #f0eee8; }
    .d-tint { color: #d6efdf; }
    @media (prefers-color-scheme: dark) {
      .d-ink { color: #efede7; }
      .d-soft { color: #c9c6be; }
      .d-faint { color: #928e85; }
      .d-acc { color: #3fc472; }
      .d-panel { color: #1a1a19; }
      .d-sunk { color: #232321; }
      .d-tint { color: #10301d; }
    }
  </style>
  <defs>
    <marker id="sa-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10"
      markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="d-acc" fill="none" stroke="currentColor" stroke-width="1" d="M1 1 L5 5 L1 9" />
    </marker>
    <marker id="sa-arrow-acc" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10"
      markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="d-acc" fill="none" stroke="currentColor" stroke-width="1" d="M1 1 L5 5 L1 9" />
    </marker>
  </defs>

  <!-- One request enters the column of tests. -->
  <rect class="d-panel" x="8" y="8" width="228" height="32" fill="currentColor" />
  <rect class="d-ink" x="8" y="8" width="228" height="32" fill="none" stroke="currentColor" stroke-width="1" />
  <text class="d-ink" x="122" y="28.5" fill="currentColor" text-anchor="middle">请求到达节点</text>
  <text class="d-faint sm" x="358" y="29" fill="currentColor" text-anchor="middle">响应方与响应内容</text>

  <path class="d-acc" d="M122 40 V61" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#sa-arrow)" />

  <!-- The method test: only GET and HEAD can reach an asset. -->
  <rect class="d-panel" x="8" y="62" width="228" height="40" fill="currentColor" />
  <rect class="d-faint" x="8" y="62" width="228" height="40" fill="none" stroke="currentColor" />
  <text class="d-ink" x="20" y="86.5" fill="currentColor">方法不是 GET 或 HEAD</text>
  <path class="d-acc" d="M236 82 H267" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#sa-arrow)" />
  <rect class="d-sunk" x="268" y="62" width="180" height="40" fill="currentColor" />
  <rect class="d-soft" x="268" y="62" width="180" height="40" fill="none" stroke="currentColor" />
  <text class="d-ink sm" x="278" y="86" fill="currentColor">由 Worker 响应</text>

  <path class="d-acc" d="M122 102 V123" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#sa-arrow)" />

  <!-- run_worker_first inverts the order for the paths it names. -->
  <rect class="d-panel" x="8" y="124" width="228" height="40" fill="currentColor" />
  <rect class="d-faint" x="8" y="124" width="228" height="40" fill="none" stroke="currentColor" />
  <text class="d-ink mono" x="20" y="141" fill="currentColor">run_worker_first</text>
  <text class="d-faint sm" x="20" y="155" fill="currentColor">true，或最多 100 个模式</text>
  <path class="d-acc" d="M236 144 H267" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#sa-arrow)" />
  <rect class="d-sunk" x="268" y="124" width="180" height="40" fill="currentColor" />
  <rect class="d-soft" x="268" y="124" width="180" height="40" fill="none" stroke="currentColor" />
  <text class="d-ink sm" x="278" y="141" fill="currentColor">由 Worker 响应</text>
  <text class="d-faint sm" x="278" y="155" fill="currentColor">不查找静态资源</text>

  <path class="d-acc" d="M122 164 V185" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#sa-arrow)" />

  <!-- _redirects runs before any file lookup. -->
  <rect class="d-panel" x="8" y="186" width="228" height="80" fill="currentColor" />
  <rect class="d-faint" x="8" y="186" width="228" height="80" fill="none" stroke="currentColor" />
  <text class="d-ink mono" x="20" y="223" fill="currentColor">_redirects</text>
  <text class="d-faint sm" x="20" y="237" fill="currentColor">按文件顺序，首个匹配生效</text>
  <g class="d-acc" fill="none" stroke="currentColor" stroke-width="1">
    <path d="M236 226 H252" />
    <path d="M252 204 V248" />
    <path d="M252 204 H267" marker-end="url(#sa-arrow-acc)" />
    <path d="M252 248 H267" marker-end="url(#sa-arrow-acc)" />
  </g>
  <rect class="d-tint" x="268" y="186" width="180" height="36" fill="currentColor" />
  <rect class="d-acc" x="268" y="186" width="180" height="36" fill="none" stroke="currentColor" />
  <text class="d-ink sm" x="278" y="201" fill="currentColor">301 302 303 307 308</text>
  <text class="d-faint sm" x="278" y="215" fill="currentColor">Location 头，无响应体</text>
  <rect class="d-tint" x="268" y="230" width="180" height="36" fill="currentColor" />
  <rect class="d-acc" x="268" y="230" width="180" height="36" fill="none" stroke="currentColor" />
  <text class="d-ink sm" x="278" y="245" fill="currentColor">200</text>
  <text class="d-faint sm" x="278" y="259" fill="currentColor">在目标路径重新路由</text>

  <path class="d-acc" d="M122 266 V303" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#sa-arrow)" />
  <path class="d-acc" d="M284 266 V282 H127" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#sa-arrow-acc)" />

  <!-- html_handling chooses which file a path can reach. -->
  <rect class="d-panel" x="8" y="304" width="228" height="80" fill="currentColor" />
  <rect class="d-faint" x="8" y="304" width="228" height="80" fill="none" stroke="currentColor" />
  <text class="d-ink mono" x="20" y="341" fill="currentColor">html_handling</text>
  <text class="d-faint sm" x="20" y="355" fill="currentColor">auto、force、drop 或 none</text>
  <g class="d-acc" fill="none" stroke="currentColor" stroke-width="1">
    <path d="M236 344 H252" />
    <path d="M252 322 V366" />
    <path d="M252 322 H267" marker-end="url(#sa-arrow-acc)" />
    <path d="M252 366 H267" marker-end="url(#sa-arrow-acc)" />
  </g>
  <rect class="d-tint" x="268" y="304" width="180" height="36" fill="currentColor" />
  <rect class="d-acc" x="268" y="304" width="180" height="36" fill="none" stroke="currentColor" />
  <text class="d-ink sm" x="278" y="319" fill="currentColor">规范路径</text>
  <text class="d-faint sm" x="278" y="333" fill="currentColor">200，附带响应体</text>
  <rect class="d-tint" x="268" y="348" width="180" height="36" fill="currentColor" />
  <rect class="d-acc" x="268" y="348" width="180" height="36" fill="none" stroke="currentColor" />
  <text class="d-ink sm" x="278" y="363" fill="currentColor">其他路径写法</text>
  <text class="d-faint sm" x="278" y="377" fill="currentColor">307，重定向到规范路径</text>

  <path class="d-acc" d="M122 384 V405" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#sa-arrow)" />

  <!-- The step Cloudflare does not need: a rolling restart leaves nodes on
       different indexes, so a miss re-reads the pointer. -->
  <rect class="d-panel" x="8" y="406" width="228" height="44" fill="currentColor" />
  <rect class="d-faint" x="8" y="406" width="228" height="44" fill="none" stroke="currentColor" />
  <text class="d-ink" x="20" y="425.5" fill="currentColor">未命中：重新读取指针</text>
  <text class="d-faint sm" x="20" y="439.5" fill="currentColor">每五秒最多一次</text>
  <path class="d-acc" d="M236 428 H267" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#sa-arrow-acc)" />
  <rect class="d-tint" x="268" y="406" width="180" height="44" fill="currentColor" />
  <rect class="d-acc" x="268" y="406" width="180" height="44" fill="none" stroke="currentColor" />
  <text class="d-ink sm" x="278" y="425" fill="currentColor">新部署中存在该文件</text>
  <text class="d-faint sm" x="278" y="439" fill="currentColor">200，附带响应体</text>

  <path class="d-acc" d="M122 450 V471" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#sa-arrow)" />

  <!-- not_found_handling fabricates a response, but not for every request. -->
  <rect class="d-panel" x="8" y="472" width="228" height="80" fill="currentColor" />
  <rect class="d-faint" x="8" y="472" width="228" height="80" fill="none" stroke="currentColor" />
  <text class="d-ink mono" x="20" y="509" fill="currentColor">not_found_handling</text>
  <text class="d-faint sm" x="20" y="523" fill="currentColor">导航请求，或没有 Worker</text>
  <g class="d-acc" fill="none" stroke="currentColor" stroke-width="1">
    <path d="M236 512 H252" />
    <path d="M252 490 V534" />
    <path d="M252 490 H267" marker-end="url(#sa-arrow-acc)" />
    <path d="M252 534 H267" marker-end="url(#sa-arrow-acc)" />
  </g>
  <rect class="d-tint" x="268" y="472" width="180" height="36" fill="currentColor" />
  <rect class="d-acc" x="268" y="472" width="180" height="36" fill="none" stroke="currentColor" />
  <text class="d-ink sm" x="278" y="487" fill="currentColor">single-page-application</text>
  <text class="d-faint sm" x="278" y="501" fill="currentColor">/index.html, 200</text>
  <rect class="d-tint" x="268" y="516" width="180" height="36" fill="currentColor" />
  <rect class="d-acc" x="268" y="516" width="180" height="36" fill="none" stroke="currentColor" />
  <text class="d-ink sm" x="278" y="531" fill="currentColor">404-page</text>
  <text class="d-faint sm" x="278" y="545" fill="currentColor">最近的 404.html，404</text>

  <path class="d-acc" d="M122 552 V573" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#sa-arrow)" />

  <!-- The asset layer has no answer left. -->
  <rect class="d-panel" x="8" y="574" width="228" height="44" fill="currentColor" />
  <rect class="d-ink" x="8" y="574" width="228" height="44" fill="none" stroke="currentColor" stroke-width="1" />
  <text class="d-ink" x="20" y="600.5" fill="currentColor">没有匹配项</text>
  <path class="d-acc" d="M236 596 H267" fill="none" stroke="currentColor" stroke-width="1" marker-end="url(#sa-arrow)" />
  <rect class="d-sunk" x="268" y="574" width="180" height="44" fill="currentColor" />
  <rect class="d-soft" x="268" y="574" width="180" height="44" fill="none" stroke="currentColor" />
  <text class="d-ink sm" x="278" y="593" fill="currentColor">由 Worker 响应</text>
  <text class="d-faint sm" x="278" y="607" fill="currentColor">没有 Worker：404</text>

  <!-- The one outcome that never reaches the Worker. -->
  <rect class="d-faint" x="8" y="640" width="440" height="42" fill="none" stroke="currentColor" stroke-dasharray="5 4" />
  <text class="d-ink sm" x="20" y="658" fill="currentColor">资源内容缺失或损坏时返回 502。</text>
  <text class="d-faint sm" x="20" y="672" fill="currentColor">请求不会回退到 Worker。</text>
</svg>
